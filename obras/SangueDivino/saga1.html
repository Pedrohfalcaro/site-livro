<script>
const COMMENTS_API_PROD = 'https://site-livro-backend.onrender.com';
const COMMENTS_API_DEV = 'http://localhost:3000';
function commentsApiBase() {
  const host = location.hostname || '';
  return (host === 'localhost' || host === '127.0.0.1') ? COMMENTS_API_DEV : COMMENTS_API_PROD;
}
function escapeHtml(str) {
  return String(str)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;');
}

let capituloAtual = null;

/* 📅 LANÇAMENTO (fonte: src/data/lancamentos.json → lancamentos.json) */
let lancamentos = {};

async function carregarLancamentos(){
  const res = await fetch('lancamentos.json');
  const data = await res.json();
  lancamentos = {};
  for (const [k, v] of Object.entries(data)) {
    lancamentos[Number(k)] = new Date(v);
  }
}

function formatLancamento(n){
  const d = lancamentos[n];
  if (!d || Number.isNaN(d.getTime())) return '';
  return d.toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' });
}

function capLiberado(n){
  const d = lancamentos[n];
  if (!d) return false;
  return new Date() >= d;
}

function aplicarEstadoCaps(){
  for (let n = 1; n <= 16; n++) {
    document.querySelectorAll(`button[onclick="abrirCap(${n})"]`).forEach((btn) => {
      if (capLiberado(n)) {
        btn.classList.remove('bloqueado');
        btn.removeAttribute('aria-disabled');
      } else {
        btn.classList.add('bloqueado');
        btn.setAttribute('aria-disabled', 'true');
      }
    });
  }
}

/* 📖 CAPÍTULO */
async function abrirCap(n){
  const conteudo = document.getElementById("conteudo");

  if(!capLiberado(n)){
    conteudo.innerHTML = `
      <div class="text-center py-10">
        <p class="text-red-400 text-lg font-bold mb-2">
          🔒 Capítulo ainda não disponível
        </p>
        <p class="text-sm opacity-70">
          Lançamento previsto: ${formatLancamento(n) || 'em breve'}.
        </p>
      </div>
    `;
    return;
  }

  conteudo.innerHTML = `<p class="opacity-70">Carregando...</p>`;

  try{
    const res = await fetch(`capitulos/cap${n}.html`);
    const html = await res.text();
    conteudo.innerHTML = html;

    capituloAtual = n;
    carregarComentarios(n);

  }catch{
    conteudo.innerHTML = `<p class="text-red-400">Erro ao carregar.</p>`;
  }
}

/* 💬 COMENTÁRIOS */
async function carregarComentarios(capitulo){
  const container = document.getElementById("listaComentarios");
  container.innerHTML = "Carregando comentários...";

  try{
    const res = await fetch(`${commentsApiBase()}/comments/sangue-divino/${capitulo}`);
    const data = await res.json().catch(() => ({}));
    const list = Array.isArray(data.comentarios) ? data.comentarios : [];

    if(!res.ok){
      // Fallback para JSON estático legado
      const local = await fetch(`comentarios/cap${capitulo}.json`);
      const localData = await local.json();
      renderComentarios(container, localData.comentarios || []);
      return;
    }

    renderComentarios(container, list);
  } catch{
    try {
      const local = await fetch(`comentarios/cap${capitulo}.json`);
      const localData = await local.json();
      renderComentarios(container, localData.comentarios || []);
    } catch {
      container.innerHTML = "Erro ao carregar comentários.";
    }
  }
}

function renderComentarios(container, comentarios){
  if(!comentarios.length){
    container.innerHTML = "Nenhum comentário ainda.";
    return;
  }
  container.innerHTML = comentarios.map((c) => `
    <div class="mb-4 pb-3 border-b border-white/10">
      <div class="flex justify-between">
        <strong>${escapeHtml(c.nome)}</strong>
        <span class="text-amber-400">⭐ ${escapeHtml(String(c.nota))}</span>
      </div>
      <p class="text-sm opacity-80">${escapeHtml(c.texto)}</p>
    </div>
  `).join('');
}

/* ⭐ ESTRELAS */
const starsContainer = document.getElementById("stars");
let rating = 0;

for(let i=1;i<=5;i++){
  const star = document.createElement("span");
  star.classList.add("star");
  star.innerHTML = "★";

  star.addEventListener("mousemove", e=>{
    const rect = star.getBoundingClientRect();
    const half = e.clientX < rect.left + rect.width/2;
    updateStars(i - (half ? 0.5 : 0));
  });

  star.addEventListener("click", e=>{
    const rect = star.getBoundingClientRect();
    const half = e.clientX < rect.left + rect.width/2;
    rating = i - (half ? 0.5 : 0);
    updateStars(rating);
  });

  starsContainer.appendChild(star);
}

function updateStars(value){
  const stars = document.querySelectorAll(".star");

  stars.forEach((star, i)=>{
    const index = i + 1;
    star.classList.remove("full","half");

    if(value >= index){
      star.classList.add("full");
    } else if(value >= index - 0.5){
      star.classList.add("half");
    }
  });
}

/* 📩 ENVIO */
async function enviarComentario(){
  const msg = document.getElementById("comentarioMsg");
  const btn = document.getElementById("btnEnviarComentario");
  const nome = document.getElementById("nome").value.trim();
  const email = document.getElementById("email").value.trim();
  const comentario = document.getElementById("comentario").value.trim();
  const website = document.getElementById("website")?.value || "";

  if(!capituloAtual){
    if(msg) msg.textContent = "Abra um capítulo antes de comentar.";
    return;
  }
  if(!nome || !email || !comentario){
    if(msg) msg.textContent = "Preencha todos os campos.";
    return;
  }
  if(!rating){
    if(msg) msg.textContent = "Escolha uma nota nas estrelas.";
    return;
  }

  if(btn) btn.disabled = true;
  if(msg) msg.textContent = "Enviando…";

  try{
    const res = await fetch(`${commentsApiBase()}/comments`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        obra: 'sangue-divino',
        cap: capituloAtual,
        nome,
        email,
        texto: comentario,
        nota: rating,
        website,
      }),
    });
    const data = await res.json().catch(() => ({}));
    if(!res.ok){
      if(msg) msg.textContent = data.error || "Erro ao enviar comentário.";
      return;
    }

    if(msg) msg.textContent = data.message || "Comentário enviado! (aguardando aprovação)";
    document.getElementById("nome").value = "";
    document.getElementById("email").value = "";
    document.getElementById("comentario").value = "";
    rating = 0;
    updateStars(0);
  }catch{
    if(msg) msg.textContent = "Erro ao enviar comentário.";
  }finally{
    if(btn) btn.disabled = false;
  }
}

/* 🔗 URL */
function abrirCapDaURL(){
  const params = new URLSearchParams(window.location.search);
  const cap = params.get("cap");

  if(cap){
    abrirCap(cap);
    window.scrollTo({ top: 0, behavior: "smooth" });
  } else {
    abrirCap(1);
  }
}

async function initSaga(){
  await carregarLancamentos();
  aplicarEstadoCaps();
  abrirCapDaURL();
}

initSaga();
</script>
